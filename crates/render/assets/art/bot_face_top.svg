<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- bot cube top (+Y). Image-up = bot forward: chevron reads facing from above -->
  <rect width="64" height="64" fill="#3a4454"/>
  <rect x="0" y="0" width="5" height="64" fill="#2aa86b"/>
  <rect x="59" y="0" width="5" height="64" fill="#2aa86b"/>
  <!-- the number's bezel (Q46): the view sets a fixed lattice of seven-
       segment edges over it, five cells of eight units, and lights the
       bot's id in whichever quarter turn reads upright from the camera;
       centered at (32, 41), clear of the chevron, the rails and the light -->
  <rect x="12" y="21" width="40" height="40" rx="5" fill="#14181f" stroke="#0e1116" stroke-width="2"/>
  <path d="M22 18 L32 8 L42 18" fill="none" stroke="#39d98a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="52" cy="12" r="3.5" fill="#0e1116"/>
  <circle cx="52" cy="12" r="2" fill="#ff00ff"/>
  <rect x="1" y="1" width="62" height="62" fill="none" stroke="#0e1116" stroke-width="2"/>
</svg>
