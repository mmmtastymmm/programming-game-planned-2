# Machines — the values behind the tables in docs/02-machines.md. This file
# is the one place a machine number is a number; the doc owns what each means.
# Every value is a num (an integer, or a decimal with up to twelve places),
# and every key is hash-affecting: changing one changes the golden-replay
# fixtures, and the PR says why.

[resource]
# the resource table (Q22): one row per kind, in this order
kinds = ["ore", "earth"]

[deployment]
# a team's deployments are one per model that runs a program — `bot`,
# `printer`, `depot`, `solar`, `charger`, `pump`, `tank` and `spout` (Q42,
# Q62, Q67); a pylon, an aqueduct and a site run none. This table holds
# what is shared across them
# the paint colors a plan may name (Q10)
colors = ["red", "blue", "green", "yellow", "purple", "orange", "cyan", "magenta"]
# the bot cap: this many bots per standing printer (Q24)
bots_per_printer = 10
# scalars a name may hold (docs/02, A machine)
name_max = 32

# health a fault costs, charged by the fault prologue (Q24)
fault_damage = 1

[model.bot]
vision = 6
hearing = 4
health = 10
death_threshold = -5
capacity = { ore = 10, earth = 4 }
move_ticks = 2
pick_ticks = 3
pick_rate = { ore = 5, earth = 4 }
drop_ticks = 1
# attack (Q25): range in tiles (squared before comparison), damage per hit,
# ticks per attack
attack_range = 1
attack_damage = 1
attack_ticks = 3
defence_damage = 0
# how far build_nearest looks, in tiles by squared distance
build_reach = 3
# realising a paint or overlay plan (Q27), and emptying the slot first (Q28)
paint_ticks = 2
overlay_ticks = 2
unpaint_ticks = 2
unoverlay_ticks = 2
# power (Q62, docs/08): the battery's capacity, and the bot's own solar per
# tick, which the sim refuses at zero — it is what wakes a flat bot
battery = 100
generation = "0.1"
# recharging from an adjacent building, at that building's `recharge_rate`
recharge_ticks = 2
# underground wire (Q62): ore per tile, and the ticks to lay and to remove
# one. Dearer than the pylons that would cover the same ground
wire_cost = { ore = 3 }
wire_ticks = 2
unwire_ticks = 2
# underground pipe (Q67, docs/09): ore per tile, and the ticks to lay and
# to remove one. Wire's numbers, since a pipe is a wire in every rule but
# what it carries; dearer than the aqueducts that would cover the ground
pipe_cost = { ore = 3 }
pipe_ticks = 2
unpipe_ticks = 2
# changing the ground (Q65, docs/03): the ticks to dig a tile down a level,
# to fill one up a level, and to mine a rock away
dig_ticks = 4
fill_ticks = 3
mine_ticks = 8
# moving (Q65, docs/03, Moving). A move takes `move_ticks`, less the bot's
# pace, plus `up_ticks` onto a higher tile, less `down_ticks` onto a lower
# one, and never fewer than one. Pace is gained a move at a time, to
# `pace_max`: at 2, a bot that has kept moving takes level ground in one
# tick, and at full pace a rise in one. A bonk takes `bonk_ticks`, the
# ticks of a move from a standstill, so the bot about to be shoved has a
# slice in which to move off. A fall costs `fall_damage` for each level
# beyond the first: a bot of 10 health is dying after a fall of six levels
pace_max = 2
up_ticks = 1
down_ticks = 1
bonk_ticks = 2
fall_damage = 2

[model.printer]
vision = 8
hearing = 6
health = 60
death_threshold = -30
store = { ore = 0 }
# built by bots (Q42): a printer site holds `cost`, plus `cost_step` for each
# printer and other printer site the team has when it is placed. The map's
# starting printer counts, so the cheapest site a team can place holds
# `cost + cost_step`. Tuning placeholders, to be set by playtesting
cost = { ore = 100 }
cost_step = { ore = 50 }
build_ticks = 60
deconstruct_ticks = 30
print_ticks = 30
# damage dealt each tick to every adjacent enemy bot (Q30); zero on other models
defence_damage = 1
# power (Q62): a printer makes more than it uses — the sim refuses data in
# which `generation` is below `drain + print_drain` — so it is never dark;
# what is left fills its battery, which bots recharge from at `recharge_rate`
# a `recharge`. A printer the map places starts full.
# Set generously for testing: a bot that moves from a standstill each time
# uses 0.4 a tick net of its own solar, so the 4 a printer has left over
# while it prints keeps the ten bots of its cap (`bots_per_printer`)
# charged by itself; one that keeps its pace moves every tick and uses
# 0.9. To make chargers and panels matter, bring `generation` down toward
# `drain + print_drain`
battery = 500
generation = 6
drain = 1
print_drain = 1
recharge_rate = 40
# water (Q67, docs/09), in levels: a printer needs `water_drain` a tick and
# `print_water` more while it prints, less its `well`, which moves no
# water. The well starts at the two together, so a printer needs nothing
# of its network and a team that lays no pipe prints as it always did; no
# check holds the well up, and bringing it down is what makes pumps
# matter. Thousandths of a level are what water is counted in: an idle
# printer would use a level in 500 ticks and a print of 30 ticks 0.3 of
# one. Its `tank` is small: 200 ticks of printing with the well at zero
tank = 2
water_drain = "0.002"
print_water = "0.008"
well = "0.01"

[model.depot]
vision = 4
hearing = 4
health = 40
death_threshold = -20
store = { ore = 500, earth = 200 }
cost = { ore = 40 }
# depots do not get dearer (Q42)
cost_step = { ore = 0 }
build_ticks = 20
deconstruct_ticks = 10
defence_damage = 0

[model.solar]
# the building that only generates (Q62): no battery, no drain, no store
vision = 2
hearing = 2
health = 20
death_threshold = -10
store = { ore = 0 }
cost = { ore = 30 }
cost_step = { ore = 0 }
build_ticks = 15
deconstruct_ticks = 8
defence_damage = 0
generation = 3

[model.charger]
# the building bots recharge from quickly (Q62): a large battery, a little
# solar of its own, filled by whatever its grid has left over
vision = 3
hearing = 3
health = 30
death_threshold = -15
store = { ore = 0 }
cost = { ore = 30 }
cost_step = { ore = 0 }
build_ticks = 15
deconstruct_ticks = 8
defence_damage = 0
battery = 1000
generation = "0.5"
drain = 0
recharge_rate = 50

[model.pylon]
# overhead line (Q62): joins its team's pylons and buildings within `span`
# tiles, by squared distance; no program, battery, generation or drain
vision = 1
hearing = 1
health = 10
death_threshold = -5
store = { ore = 0 }
cost = { ore = 5 }
cost_step = { ore = 0 }
build_ticks = 5
deconstruct_ticks = 3
defence_damage = 0
span = 4

[model.pump]
# lifts water off the wet tile beside it into its network (Q67, docs/09),
# up to `pump_rate` levels a tick, while it is powered: it has no
# generation and no battery, so its `drain` must come from its grid, and a
# pump that touches nothing is dark. A printer's 4 to spare runs four.
# At 0.05 a tile a level deep is lifted in 20 ticks, well under what the
# flow brings a tile in a pond. The rest is the charger's row
vision = 3
hearing = 3
health = 30
death_threshold = -15
store = { ore = 0 }
cost = { ore = 30 }
cost_step = { ore = 0 }
build_ticks = 15
deconstruct_ticks = 8
defence_damage = 0
drain = 1
pump_rate = "0.05"

[model.tank]
# only holds water (Q67): `tank` levels, ten times the printer's own. The
# rest is the depot's row, with nothing in its store
vision = 4
hearing = 4
health = 40
death_threshold = -20
store = { ore = 0 }
cost = { ore = 40 }
cost_step = { ore = 0 }
build_ticks = 20
deconstruct_ticks = 10
defence_damage = 0
tank = 20

[model.spout]
# pours onto the tile it faces (Q67), up to `pour_rate` levels a tick: a
# pump's rate, so that one pump keeps one spout running. It drains no
# power, so only a flood darkens it. The rest is the charger's row
vision = 3
hearing = 3
health = 30
death_threshold = -15
store = { ore = 0 }
cost = { ore = 30 }
cost_step = { ore = 0 }
build_ticks = 15
deconstruct_ticks = 8
defence_damage = 0
pour_rate = "0.05"

[model.aqueduct]
# overhead pipe (Q67): joins its team's aqueducts and buildings within
# `span` tiles, by squared distance, into a water network; no program,
# no tank and no need. The pylon's row, span included
vision = 1
hearing = 1
health = 10
death_threshold = -5
store = { ore = 0 }
cost = { ore = 5 }
cost_step = { ore = 0 }
build_ticks = 5
deconstruct_ticks = 3
defence_damage = 0
span = 4

[model.site]
# a site's store capacity is the price of what it becomes (Q42); its ranges
# and health are these
vision = 2
hearing = 2
health = 10
death_threshold = -5
deconstruct_ticks = 5
defence_damage = 0

[loudness]
# per sound cause (docs/02, Sounds); added to the hearer's range
move = 1
pick = 2
drop = 2
print = 4
build = 4
deconstruct = 3
attack = 3
dig = 3
fill = 2
mine = 4
bonk = 3

[power]
# the share of its battery at or below which a bot takes `low_power`, and
# the share a bot out of power must be charged back to before it wakes
# (Q62, Q63); the two start equal and are tuned apart freely
low_power_level = "0.2"
wake_level = "0.2"

[power.cost]
# What a bot's call of each game builtin takes from its battery as it
# begins (Q62): one key per game builtin, zero or more. The sim refuses a
# cost above `wake_level` of the bot's battery, so a bot that has woken can
# pay for any one call. Placeholders until the game is played
see = 0
hear = 0
tile = 0
tiles = 0
me = 0
plans = 0
painted = 0
overlaid = 0
power = 0
wires = 0
water = 0
pipes = 0
move = 1
move_to = 1
pick = 1
drop = 1
recharge = 0
build = 2
build_nearest = 2
paint = 1
unpaint = 1
overlay = 1
unoverlay = 1
wire = 1
unwire = 1
pipe = 1
unpipe = 1
dig = 2
fill = 2
mine = 2
deconstruct = 2
attack = 2
wait = 0
log = 0
rename = 0
set_color = 0
# a spout's alone, and a building's calls take nothing
pour = 0
