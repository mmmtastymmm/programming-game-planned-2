# Machines — the values behind the tables in docs/02-machines.md. This file
# is the one place a machine number is a number; the doc owns what each means.
# Every value is a num (an integer, or a decimal with up to twelve places),
# and every key is hash-affecting: changing one changes the golden-replay
# fixtures, and the PR says why.

[resource]
# the resource table (Q22): one row per kind, in this order
kinds = ["ore"]

[deployment]
# a team's deployments are one per model, `bot`, `printer` and `depot` (Q42);
# this table holds what is shared across them
# the paint colors a plan may name (Q10)
colors = ["red", "blue", "green", "yellow", "purple", "orange", "cyan", "magenta"]
# the bot cap: this many bots per standing printer (Q24)
bots_per_printer = 10
# scalars a name may hold (docs/02, A machine)
name_max = 32

# health a fault costs, charged by the fault prologue (Q24)
fault_damage = 1

[model.bot]
vision = 6
hearing = 4
health = 10
death_threshold = -5
capacity = { ore = 10 }
move_ticks = 2
pick_ticks = 3
pick_rate = { ore = 5 }
drop_ticks = 1
# attack (Q25): range in tiles (squared before comparison), damage per hit,
# ticks per attack
attack_range = 1
attack_damage = 1
attack_ticks = 3
defence_damage = 0
# how far build_nearest looks, in tiles by squared distance
build_reach = 3
# realising a paint or overlay plan (Q27), and emptying the slot first (Q28)
paint_ticks = 2
overlay_ticks = 2
unpaint_ticks = 2
unoverlay_ticks = 2

[model.printer]
vision = 8
hearing = 6
health = 60
death_threshold = -30
store = { ore = 0 }
# built by bots (Q42): the first printer site holds `cost`, and each printer
# or printer site the team already has adds `cost_step`. Tuning placeholders,
# to be set by playtesting
cost = { ore = 100 }
cost_step = { ore = 50 }
build_ticks = 60
deconstruct_ticks = 30
print_ticks = 30
# damage dealt each tick to every adjacent enemy bot (Q30); zero on other models
defence_damage = 1

[model.depot]
vision = 4
hearing = 4
health = 40
death_threshold = -20
store = { ore = 500 }
cost = { ore = 40 }
# depots do not get dearer (Q42)
cost_step = { ore = 0 }
build_ticks = 20
deconstruct_ticks = 10
defence_damage = 0

[model.site]
# a site's store capacity is the price of what it becomes (Q42); its ranges
# and health are these
vision = 2
hearing = 2
health = 10
death_threshold = -5
deconstruct_ticks = 5
defence_damage = 0

[loudness]
# per sound cause (docs/02, Sounds); added to the hearer's range
move = 1
pick = 2
drop = 2
print = 4
build = 4
deconstruct = 3
attack = 3
