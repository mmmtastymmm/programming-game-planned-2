# The world — the values behind the tables in docs/03-world.md. This file is
# the one place a world number is a number; the doc owns what each means.
# Every value is a num, and every key is hash-affecting: changing one changes
# the golden-replay fixtures, and the PR says why.

[terrain.ground]
passable = true
blocks_sight = false

[terrain.rock]
passable = false
blocks_sight = true

[height]
# every tile's height is a whole number of levels from 0 to max (Q65,
# docs/03); a map that gives no heights has every tile at default and its
# ~ tiles lake_depth below that; a bot steps between tiles whose heights
# differ by at most step
max = 9
default = 4
lake_depth = 2
step = 1
# the earth a bot takes into its load on digging a tile down a level, and
# spends on filling one up a level
earth_per_level = 1

[water]
# water is counted in parts, parts of them to a level of height (Q65,
# docs/09): how finely it is counted, and nothing else. wet, wade and
# max_rate are in levels, so that changing parts changes none of them: a
# tile is wet from wet levels of water up and damp below; a bot wades up
# to wade levels; a map's spring or sink moves at most max_rate levels a
# tick. film is in parts, since it is the rounding it clears up: a tile
# holding film parts or fewer, and given none, dries into the ground
# water. The flow runs passes times in a tick, so water moves up to
# passes tiles a tick and a slope carries passes times what one pass
# would. A flooded machine (a bot in more than wade, a building or a site
# on a wet tile) loses flood_damage health a tick.
parts = 1000
wet = "0.1"
film = 4
wade = 1
max_rate = 1
passes = 4
flood_damage = "0.2"

[deposit.ore]
# a map may set a deposit's cap and regrowth per tile up to these
max_cap = 1000
max_regrowth = 2

[mark]
# the closed list of overlay labels a player may plan on a tile (Q10, Q26,
# Q27); a building plan names a model instead and is not an overlay
overlays = ["a", "b", "c", "d"]

[speed]
# ticks per real second a match may run at (Q6); 0 is pause
steps = [0, 1, 2, 5, 10, 20, 60]
