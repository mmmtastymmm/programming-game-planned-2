# The world — the values behind the tables in docs/03-world.md. This file is
# the one place a world number is a number; the doc owns what each means.
# Every value is a num, and every key is hash-affecting: changing one changes
# the golden-replay fixtures, and the PR says why.

[terrain.ground]
passable = true
blocks_sight = false

[terrain.rock]
passable = false
blocks_sight = true

[terrain.water]
passable = false
blocks_sight = false

[deposit.ore]
# a map may set a deposit's cap and regrowth per tile up to these
max_cap = 1000
max_regrowth = 2

[mark]
# the closed list of overlay labels a player may plan on a tile (Q10, Q26,
# Q27); a building plan names a model instead and is not an overlay
overlays = ["a", "b", "c", "d"]

[speed]
# ticks per real second a match may run at (Q6); 0 is pause
steps = [0, 1, 2, 5, 10, 20, 60]
