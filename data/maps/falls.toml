# A map to watch water on (Q65): ground at height 5 with a river bed cut
# across it from west to east, stepping down a level every four tiles into
# a basin. A spring at the head of the bed brings ground water up and a
# sink in the basin takes it down, so the river runs for as long as the
# match does. A small lake stands in the south-west, at rest, and a hill
# in the north-east. Terrain as in first.toml; heights are one digit per
# tile, shaped the same.

