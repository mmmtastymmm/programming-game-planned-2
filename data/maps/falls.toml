# A map to watch water on (Q65): ground at height 7 with a river bed cut
# across it from west to east, stepping down a level every three tiles
# into a deep basin. A spring at the head of the bed brings ground water
# up and a sink in the basin's corner takes as much down, so the river
# is a loop: what the sink takes, the spring brings back. The spring's
# head is the height of the banks, so however the cut fills, nothing
# runs over them. A small lake stands in the south-west, at rest, and a
# hill in the north-east. Terrain as in first.toml; heights are one digit
# per tile, shaped the same.

