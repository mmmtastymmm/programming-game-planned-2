# The first map: two teams, mirrored across the centre. Terrain is one
# character per tile, one row per line; the first row is the north edge and
# y runs north, with (0, 0) at the centre (docs/03), so this 24 by 16 map
# runs from (-12, -8) at the south-west to (11, 7) at the north-east:
#   .  ground    o  ground with a deposit    #  rock    ~  water
# Every deposit takes [deposit_default] unless [[deposit]] overrides it.
# This file is part of a replay's inputs and is hashed into its identity.

name = "first"
# starting ticks per real second, one of data/world.toml's speed steps
speed = 10
width = 24
height = 16

terrain = """
........................
..o.........##..........
..o.........##......~~..
............##......~~..
........................
....##..................
....##.......oo.........
.............oo.........
.........oo.............
.........oo.......##....
..................##....
........................
..~~......##............
..~~......##.........o..
.....................o..
........................
"""

[deposit_default]
cap = 500
regrowth = 1
amount = 500

[[team]]
start = [-9, 4]

[[team]]
start = [8, -5]
