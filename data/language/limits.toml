# Limits of the unit language — the values behind the limits table in
# docs/01-language/execution.md. This file is the one place a limit is a
# number; the doc owns what each limit bounds and what exhausting it does.
# Every value is a non-negative integer, and every key is hash-affecting:
# changing one changes the golden-replay fixtures, and the PR says why.

[budget]
# cost units per unit per tick, main flow or hook; exhausting it yields, and a
# deficit carries forward until it is paid
tick = 200
# cost units per hook invocation, total across ticks; exhausting one escalates
[budget.hook]
fault = 2000
dying = 2000

[depth]
# nested calls, including recursion and __init__; exceeding it is RecursionError
call = 64
# how deep a walk may descend: a non-container is depth 0, a container one more
# than its deepest element; brackets and blocks nested in source share the bound
nesting = 32

[size]
# elements in one list, tuple, dict or set; scalars in one str
collection = 10000
# elements and scalars reachable from the unit: objects counted once, str and
# tuple values once per slot that holds them
live_values = 100000

[bundle]
# files per bundle, which is also the module limit
files = 32
# bytes per file
file_bytes = 65536
