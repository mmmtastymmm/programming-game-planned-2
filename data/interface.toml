# The renderer's tuning — the values behind docs/07-interface.md. Nothing
# here reaches the sim or a hash; a peer with other numbers sees the same
# match.

[faults]
# a fault mark stays over a machine this many ticks after its record's tick
fault_mark_ticks = 30

[debugging]
# The debugger's and a replay's saved states and limits (Q55; docs/07,
# Debugging). A state is saved at every tick that is a multiple of
# debug_checkpoint_ticks; the match keeps the last debug_checkpoints_kept,
# and a replay's playback, on reaching that many, drops every other one and
# doubles its interval, so a seek anywhere re-runs at most one interval.
debug_checkpoint_ticks = 50
debug_checkpoints_kept = 16
# every step but run stops after this many ticks, passed to the fork's
# step as an argument; the sim reads none of these
debug_step_max_ticks = 600
# further hits listed beside the open fork, the latest first
debug_hits_kept = 20

[teams]
# The team colors (Q43, Q45, Q47, Q48): the lights of a bot, a printer
# and a depot glow in their team's color, a printer's trim is painted in
# it, and a site is outlined in it. The player's own team defaults to `player`,
# green; every other team to the next of `outlines`, in team order
# skipping the player's. Blue comes first,
# so a default one-on-one is green against blue, which the commonest
# colorblindness tells apart. The player may change any of them in the
# inspector; the choice is saved in colors.toml beside the programs.
player = "#4fc76a"
outlines = ["#4fa3f2", "#f24c40", "#f2c94c", "#e254c7", "#f2913f", "#9b59f2", "#45d4d4"]

[bodies]
# the neutral body (Q43): a bot whose `color` is None wears this atlas, one
# of the paint colors' or "white"; buildings are drawn in their own
# untinted neutral materials
neutral = "white"
