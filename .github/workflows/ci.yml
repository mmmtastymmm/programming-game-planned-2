# Both jobs shell out to scripts/ci.sh, which is also what you run locally
# (`scripts/ci.sh` for everything, or `rust` / `docs` for one half). Keeping the
# commands in the script rather than in this file is what stops local and CI
# drifting apart.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Seconds, and needs no Rust toolchain — so a docs-only PR gets fast feedback
  # instead of waiting on a full build. This repo is design-first, so most PRs
  # are docs-only.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-registers verifies that the commit hashes cited in
          # docs/history/ resolve — three of them rotted silently when history
          # was rewritten. A shallow clone has no objects to resolve them
          # against, so the check would fail on every hash.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      # Not a hand-copied list of the steps: scripts/ci.sh prints each one as it
      # runs, and a label restating them goes stale the next time one is added.
      - name: Fast checks (scripts/ci.sh docs)
        env:
          # Bounds the size gate's history walk to the commits under review. An
          # unbounded walk judges the base branch too, so one oversized blob
          # anywhere in main's past would fail every PR forever, telling authors
          # to rewrite a branch that did not introduce it. Empty on a push, where
          # the whole of HEAD is the right scope.
          SIZE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci.sh docs

  # Determinism gate (CLAUDE.md): golden-replay fixtures are checked in, so any
  # sim behavior change fails here until the fixture is regenerated
  # (UPDATE_GOLDEN=1) — and the PR explains why.
  #
  # No toolchain action: rust-toolchain.toml pins the compiler, and letting the
  # action override it would defeat the pin the golden hashes depend on.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The cache carries the Bevy build between runs: saved even when the
      # job fails, so one red run does not cost the next its warm target
      # directory, and keyed by the lockfile as the action does by default.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # `render` links Bevy, whose Linux build wants ALSA and udev headers
      # (docs/06: `render` is the one crate with a Bevy dependency, and its
      # test is that it builds). The determinism jobs never build it.
      - name: Bevy's Linux build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev pkg-config
      - name: fmt, clippy, test (incl. golden replays)
        run: scripts/ci.sh rust

  # Cross-architecture determinism (docs/06, Testing; T15). The golden
  # fixtures were generated on one machine, and lockstep needs every peer's
  # architecture to agree with it: the battery runs on x86-64 and on arm64,
  # each side checks its streams against the checked-in fixtures, and the
  # job below diffs the two sides' final hashes line for line.
  determinism:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: determinism battery (scripts/determinism-battery.sh)
        run: scripts/determinism-battery.sh hashes-${{ matrix.runner }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.runner }}
          path: hashes-${{ matrix.runner }}.txt
          if-no-files-found: error

  cross-architecture:
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          merge-multiple: true
      # The compare is the battery script's `compare` mode, not an inline
      # diff: scripts/check-checks.mjs --rust seeds a disagreement against
      # the same code this step runs.
      - name: the two architectures agree on every stream
        run: scripts/determinism-battery.sh compare hashes-ubuntu-latest.txt hashes-ubuntu-24.04-arm.txt
