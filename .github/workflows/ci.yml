# Both jobs shell out to scripts/ci.sh, which is also what you run locally
# (`scripts/ci.sh` for everything, or `rust` / `docs` for one half). Keeping the
# commands in the script rather than in this file is what stops local and CI
# drifting apart.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Seconds, and needs no Rust toolchain — so a docs-only PR gets fast feedback
  # instead of waiting on a full build. This repo is design-first, so most PRs
  # are docs-only.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-registers verifies that the commit hashes cited in
          # docs/history/ resolve — three of them rotted silently when history
          # was rewritten. A shallow clone has no objects to resolve them
          # against, so the check would fail on every hash.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      # Not a hand-copied list of the steps: scripts/ci.sh prints each one as it
      # runs, and a label restating them goes stale the next time one is added.
      - name: Fast checks (scripts/ci.sh docs)
        env:
          # Bounds the size gate's history walk to the commits under review. An
          # unbounded walk judges the base branch too, so one oversized blob
          # anywhere in main's past would fail every PR forever, telling authors
          # to rewrite a branch that did not introduce it. Empty on a push, where
          # the whole of HEAD is the right scope.
          SIZE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci.sh docs

  # Determinism gate (CLAUDE.md): golden-replay fixtures are checked in, so any
  # sim behavior change fails here until the fixture is regenerated
  # (UPDATE_GOLDEN=1) — and the PR explains why.
  #
  # No toolchain action: rust-toolchain.toml pins the compiler, and letting the
  # action override it would defeat the pin the golden hashes depend on.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: fmt, clippy, test (incl. golden replays)
        run: scripts/ci.sh rust
