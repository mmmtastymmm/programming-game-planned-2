[workspace]
resolver = "3"
members = ["crates/sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# A renderer crate is unusably slow fully unoptimized (this was measured on the
# predecessor project with Bevy). Optimize dependencies even in dev builds; our
# own crates stay fast to compile. Costs nothing while `sim` is the only member,
# and is already right the day a renderer lands.
[profile.dev.package."*"]
opt-level = 2
